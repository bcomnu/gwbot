# Alembic configuration for the Telegram Giveaway Bot.
# The database URL is loaded dynamically from the app settings (see migrations/env.py),
# so you normally do NOT need to set sqlalchemy.url here.

[alembic]
script_location = migrations
prepend_sys_path = .
# version_path_separator = os

# sqlalchemy.url is intentionally left blank; env.py injects it from DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
